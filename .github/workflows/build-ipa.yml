name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build unsigned IPA
        run: zsh ./build-unsigned-ipa.sh

      - name: Verify app bundle
        run: |
          APP="build-unsigned/Payload/FlappyBird.app"
          plutil -p "$APP/Info.plist"
          test -f "$APP/FlappyBird"
          file "$APP/FlappyBird"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-IPA
          path: build-unsigned/FlappyBird-unsigned.ipa
